<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Edu - Gestão Acadêmica</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="alunos.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">
        <img src="imagens/logo.png" alt="Logo do System Edu">
      </div>
      <div>
        <h1>System Edu</h1>
        <span>Gestão Acadêmica</span>
      </div>
    </div>

    <nav class="menu">

      <a href="#" class="menu-item active">
        <span class="menu-icon">♙</span>
        Turmas e Alunos
      </a>

    </nav>

    <div class="storage">
      <div class="storage-icon">▤</div>
      <div>
        <strong>Dados salvos localmente</strong>
        <small>via <b>LocalStorage</b></small>
      </div>
      <span class="check">✓</span>
    </div>

  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">

      <button class="hamburger">☰</button>

      <div class="header-right">

        <div class="notification">
          ♧
          <span>3</span>
        </div>

        <div class="moon">☾</div>

        <div class="profile">
          <div class="avatar">●</div>

          <div class="profile-info">
            <strong>Usuário</strong>
            <small>Estudante</small>
          </div>

          <span>⌄</span>
        </div>

      </div>

    </header>

    <!-- FOOTER -->
    <footer>
      System Edu © 2025 - Todos os dados são armazenados localmente
      (<span>LocalStorage</span>)

      <small>Versão 1.0.0</small>
    </footer>

  </main>

</body>

</html>
